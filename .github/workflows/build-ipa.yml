
name: Build Freetify iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build iOS app
        run: |
          xcodebuild \
            -project MRSC.xcodeproj \
            -scheme MRSC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$RUNNER_TEMP/Build/Build/Products/Release-iphoneos/MRSC.app" \
            "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/Freetify-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Freetify-IPA
          path: Freetify-unsigned.ipa
          retention-days: 7
